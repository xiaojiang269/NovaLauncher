name: Android smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Download APK
        run: |
          curl -fL -o app.apk https://github.com/xiaojiang269/NovaLauncher/releases/download/v3.2.5/NovaLauncher-Android-3.8.0.apk
          ls -l app.apk

      - name: Run emulator and collect logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install -r app.apk || adb install app.apk
            adb shell pm list packages | grep novalauncher
            adb logcat -c
            adb shell am start -n com.xiaojiang269.novalauncher/.SplashActivity
            sleep 45
            adb shell screencap -p /sdcard/shot1.png
            adb pull /sdcard/shot1.png shot1.png
            adb logcat -d > logcat.txt
            adb shell dumpsys activity activities | head -40 > activity.txt
            grep -E "NovaGL|novalauncher|AndroidRuntime|FATAL" logcat.txt | tail -120 > filtered.txt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke
          path: |
            shot1.png
            logcat.txt
            filtered.txt
            activity.txt
