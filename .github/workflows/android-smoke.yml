name: Android smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Download APK
        run: |
          curl -fL -o app.apk https://github.com/xiaojiang269/NovaLauncher/releases/download/v3.2.5/NovaLauncher-Android-4.0.24-ci.apk
          ls -l app.apk

      - name: Run emulator and collect logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install -r app.apk || adb install app.apk
            adb shell pm list packages | grep novalauncher
            adb logcat -c
            adb shell am start -n com.xiaojiang269.novalauncher/.GameActivity --es version 1.20.1 --es user Tester --ei mem 1200
            sleep 60
            adb shell screencap -p /sdcard/shot0.png
            adb pull /sdcard/shot0.png shot0.png
            sleep 240
            adb shell screencap -p /sdcard/shot1.png
            adb pull /sdcard/shot1.png shot1.png
            sleep 60
            adb shell screencap -p /sdcard/shot2.png
            adb pull /sdcard/shot2.png shot2.png
            adb shell wm size
            sleep 150
            adb shell screencap -p /sdcard/shot3.png
            adb pull /sdcard/shot3.png shot3.png
            # 虚拟按键实测：点一下 E（打开背包），再点一下空格（跳跃）
            adb shell input tap 483 283 || true
            sleep 15
            adb shell screencap -p /sdcard/shotE.png || true
            adb pull /sdcard/shotE.png shotE.png || true
            adb shell input tap 541 198 || true
            sleep 10
            adb shell screencap -p /sdcard/shotJump.png || true
            adb pull /sdcard/shotJump.png shotJump.png || true
            adb logcat -d > logcat.txt
            adb shell dumpsys activity activities | head -40 > activity.txt
            adb shell run-as com.xiaojiang269.novalauncher cat files/mc-out.log > mc-out.log 2>&1 || true
            adb shell "run-as com.xiaojiang269.novalauncher sh -c 'for f in files/games/1.20.1/hs_err_pid*.log; do echo \"=== \$f\"; cat \$f; done'" > hs_err.log 2>&1 || true
            wc -c hs_err.log || true
            adb shell "run-as com.xiaojiang269.novalauncher sh -c 'for f in files/hs_err_*.log; do echo \"=== \$f\"; cat \$f; done'" > hs_err_int.log 2>&1 || true
            wc -c hs_err_int.log || true
            wc -c hs_err_ext.log || true
            adb shell "run-as com.xiaojiang269.novalauncher ls -la /storage/emulated/0/Android/data/com.xiaojiang269.novalauncher/files/games/1.20.1/" > gamedir.txt 2>&1 || true
            grep -A40 "Problematic frame" hs_err.log | head -60 || true
            tail -60 mc-out.log || true
            grep -E "NovaRT|jrelog|LIBGL|NovaGL|novalauncher|AndroidRuntime|FATAL|OpenJDK" logcat.txt | tail -120 > filtered.txt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke
          path: |
            shot0.png
            shot1.png
            shot2.png
            shot3.png
            shotE.png
            shotJump.png
            logcat.txt
            filtered.txt
            activity.txt
            mc-out.log
            hs_err.log
            hs_err_int.log
            gamedir.txt
